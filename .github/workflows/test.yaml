name: Test
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '18.x'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.config/yarn/global
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install
        # npm ci installs strictly from package-lock.json, so CI cannot silently
        # drift from the committed lockfile the way `npm install` can.
        # Peer-dependency resolution comes from .npmrc (legacy-peer-deps=true) —
        # see that file for why it is required today.
        run: npm ci

      - name: Typescript
        run: npm run typescript

      - name: ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run ci:test -- --passWithNoTests

